; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 250000
monitor_filters = esp32_exception_decoder
;build_type = debug
build_src_filter = +<*> -<../Front_MCU/>
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-DCONFIG_BT_NIMBLE_MAX_CCCDS=2
	-DMYNEWT_VAL_BLE_ATT_SVR_MAX_PREP_ENTRIES=4
	-DCONFIG_BT_NIMBLE_LOG_LEVEL=5
	-DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps = 
	roger-random/ESP_8_BIT Color Composite Video Library@^1.3.2
	adafruit/Adafruit ADS1X15@^2.5.0
	h2zero/NimBLE-Arduino@^1.4.2

[env:front_mcu]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.maximum_size = 32256
build_src_filter = +<../Front_MCU/main.cpp>
lib_deps = 
	arminjo/digitalWriteFast@^1.3.1
	autowp/autowp-mcp2515@^1.3.1

[env:get_irk]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 250000
build_src_filter = +<../tools/get_irk/main.cpp>
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-DCONFIG_BT_NIMBLE_LOG_LEVEL=5
	-DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps = 
	h2zero/NimBLE-Arduino@^1.4.2

